name: Update rail schedule

on:
  schedule:
    # Daily at 04:00 UTC (07:00 IDT / 06:00 IST — morning in Israel).
    # Israel MOT refreshes the GTFS nightly; the diff-detect step keeps the
    # repo quiet on no-op days, so daily is cheap.
    - cron: "0 4 * * *"
  workflow_dispatch: {}
  # Run on PRs that touch the workflow or the build script so we can validate
  # changes before they reach main. The "Open PR" step is gated to skip during
  # PR runs — we only want to exercise the build + diff logic here.
  pull_request:
    paths:
      - .github/workflows/update-schedule.yml
      - scripts/build-schedule.js
      - package.json

permissions:
  contents: write
  pull-requests: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No deps to install — the build script is pure Node + shells out to
      # unzip. Skip npm ci unless we add deps that the script needs.

      - name: Download MOT GTFS
        run: |
          set -euo pipefail
          success=0
          
          # Try Hasadna community mirror first (bypasses MOT WAF)
          echo "Trying Hasadna OpenBus S3 mirror..."
          TODAY=$(date -u +%Y/%m/%d)
          YESTERDAY=$(date -u -d "yesterday" +%Y/%m/%d)
          
          for DATE in "$TODAY" "$YESTERDAY"; do
            URL="https://openbus-stride-public.s3.eu-west-1.amazonaws.com/gtfs_archive/$DATE/israel-public-transportation.zip"
            echo "Fetching $URL"
            if curl -fL --retry 2 -o /tmp/gtfs.zip "$URL" && unzip -t /tmp/gtfs.zip >/dev/null 2>&1; then
              echo "Successfully downloaded from mirror."
              success=1
              break
            fi
          done
          
          if [ "$success" -eq 0 ]; then
            echo "Mirror failed. Falling back to official MOT server..."
            for i in {1..2}; do
              echo "Attempt $i to download official GTFS..."
              rm -f /tmp/gtfs.zip
              if curl -fL --retry 2 --retry-all-errors --retry-delay 5 --max-time 600 \
                -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
                -o /tmp/gtfs.zip \
                https://gtfs.mot.gov.il/gtfsfiles/israel-public-transportation.zip; then
                
                if unzip -t /tmp/gtfs.zip >/dev/null 2>&1; then
                  success=1
                  break
                else
                  echo "Downloaded file is not a valid ZIP archive (possibly a WAF block page)."
                fi
              fi
              echo "Download or verification failed. Waiting 30 seconds before retry..."
              sleep 30
            done
          fi
          
          if [ "$success" -eq 0 ]; then
            echo "Failed to download a valid GTFS zip."
            exit 1
          fi
          ls -lh /tmp/gtfs.zip

      - name: Rebuild rail_times_index.json
        run: node scripts/build-schedule.js /tmp/gtfs.zip www/rail_times_index.json

      - name: Detect real changes
        id: changes
        run: |
          set -euo pipefail
          # Ignore generatedAt, generatedFrom, serviceCount, and version so no-op nightlies
          # don't churn the repo.
          if git diff --quiet -- www/rail_times_index.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes."
            exit 0
          fi
          diff_payload="$(
            diff <(jq 'del(.generatedAt,.generatedFrom,.serviceCount,.version)' <(git show HEAD:www/rail_times_index.json)) \
                 <(jq 'del(.generatedAt,.generatedFrom,.serviceCount,.version)' www/rail_times_index.json) || true
          )"
          if [ -z "$diff_payload" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Only metadata changed; skipping PR."
            git checkout -- www/rail_times_index.json
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Substantive changes detected."

      - name: Build PR body
        if: steps.changes.outputs.changed == 'true' && github.event_name != 'pull_request'
        id: prbody
        run: |
          set -euo pipefail
          {
            echo "Automated rebuild from"
            echo "<https://gtfs.mot.gov.il/gtfsfiles/israel-public-transportation.zip>."
            echo ""
            echo "## Diff summary"
            echo ""
            git show HEAD:www/rail_times_index.json > /tmp/prev.json
            prev_pairs="$(jq '.pairs | keys | sort | .[]' -r /tmp/prev.json | sort -u)"
            new_pairs="$(jq '.pairs | keys | sort | .[]' -r www/rail_times_index.json | sort -u)"
            added="$(comm -13 <(echo "$prev_pairs") <(echo "$new_pairs") || true)"
            removed="$(comm -23 <(echo "$prev_pairs") <(echo "$new_pairs") || true)"
            if [ -n "$added" ]; then
              echo "### Added pairs"
              echo '```'
              echo "$added"
              echo '```'
            fi
            if [ -n "$removed" ]; then
              echo "### Removed pairs"
              echo '```'
              echo "$removed"
              echo '```'
            fi
            prev_count="$(jq '.pairCount' /tmp/prev.json)"
            new_count="$(jq '.pairCount' www/rail_times_index.json)"
            prev_stations="$(jq '.stationCount' /tmp/prev.json)"
            new_stations="$(jq '.stationCount' www/rail_times_index.json)"
            echo ""
            echo "- stationCount: $prev_stations → $new_stations"
            echo "- pairCount:    $prev_count → $new_count"
            echo ""
            echo "Review per-train changes via the file diff below before merging."
          } > /tmp/pr_body.md
          {
            echo "body<<EOF"
            cat /tmp/pr_body.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Bump version and update changelog
        if: steps.changes.outputs.changed == 'true' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          # Configure git so npm version can run (though we use --no-git-tag-version)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Bump patch version
          npm version patch --no-git-tag-version
          NEW_VER=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=$NEW_VER" >> "$GITHUB_ENV"

          # Inject version into the built JSON
          jq ".version = \"$NEW_VER\"" www/rail_times_index.json > /tmp/rt.json && mv /tmp/rt.json www/rail_times_index.json

          # Update CHANGELOG.md
          # Insert a new release block under ## [Unreleased]
          TODAY=$(date +%Y-%m-%d)
          CH_BLOCK="## [$NEW_VER] - $TODAY\n\n### Changed\n- **Schedule Refresh.** Updated train schedule.\n"
          sed -i "/## \[Unreleased\]/a \\\n$CH_BLOCK" CHANGELOG.md

      # NOTE: This step requires "Allow GitHub Actions to create and approve pull requests"
      # to be enabled in Settings -> Actions -> General -> Workflow permissions.
      - name: Open PR
        if: steps.changes.outputs.changed == 'true' && github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.PAT }}
          branch: chore/refresh-rail-schedule
          base: main
          commit-message: "chore: refresh rail schedule to v${{ env.NEW_VERSION }}"
          title: "chore: refresh rail schedule to v${{ env.NEW_VERSION }}"
          body: ${{ steps.prbody.outputs.body }}
          delete-branch: true
          add-paths: |
            www/rail_times_index.json
            www/app.js
            package.json
            package-lock.json
            CHANGELOG.md
            android/app/build.gradle
